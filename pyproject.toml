[tool.poetry]
name = "ha-automation-cli"
version = "0.1.0"
description = "Command-line helper for managing Home Assistant automations"
authors = ["Simbo <simbo@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "ha_automation"}]

[tool.poetry.scripts]
ha-automation = "ha_automation.__main__:app"

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27"
websockets = "^12.0"
pydantic = "^2.0"
typer = {extras = ["all"], version = "^0.9.0"}
"ruamel.yaml" = "^0.18"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
vcrpy = "^6.0"
ruff = "^0.2"
mypy = "^1.8"
pytest-cov = "^4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RET", "SIM", "ARG"]
ignore = ["S101"]  # Allow assert in tests
line-length = 88
target-version = "py311"

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ARG"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ha_automation"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false