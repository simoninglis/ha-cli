[tool.poetry]
name = "ha-cli"
version = "0.3.2"
description = "Multi-domain command-line tool for managing Home Assistant configurations"
authors = ["Simbo <simbo@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "ha_cli"}]
repository = "https://github.com/simoninglis/ha-cli"
homepage = "https://github.com/simoninglis/ha-cli"
keywords = ["home-assistant", "cli", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
]

[tool.poetry.scripts]
ha-cli = "ha_cli.__main__:main"
ha-automation = "ha_cli.__main__:automation_compat"

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27"  # Async HTTP client for all REST API operations
websockets = "^12.0"
pydantic = "^2.0"
typer = ">=0.15.0"
"ruamel.yaml" = "^0.18"
pyyaml = "^6.0"  # Required for cloud/cli.py and automations/service.py YAML parsing
python-dotenv = "^1.1.0"
playwright = "^1.57.0"  # Browser automation for dashboard screenshots

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
vcrpy = "^6.0"
ruff = "^0.2"
mypy = "^1.8"
pytest-cov = "^4.1"
types-pyyaml = "^6.0.12.20250915"
pytest-playwright = "^0.7.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RET", "SIM", "ARG"]
ignore = [
    "S101",   # Allow assert in tests
    "B008",   # Allow typer.Option() in function defaults (standard typer pattern)
    "A001",   # Allow shadowing builtins like 'list' (common in CLI commands)
    "A002",   # Allow argument names like 'format', 'id' shadowing builtins
    "E402",   # Allow module imports not at top (often intentional for late imports)
    "RET505", # Allow else after return (often clearer for complex logic)
    "RET506", # Allow elif after raise (often clearer for error handling)
    "SIM102", # Allow nested if (sometimes clearer than combined conditions)
    "UP041",  # Allow asyncio.TimeoutError for Python 3.10 compat
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG"]
"**/cli.py" = ["ARG001", "ARG002", "UP035", "UP006"]  # CLI commands: unused args, List (Typer compatibility)
"**/service.py" = ["ARG001", "ARG002"]  # Service methods may have unused args for interface consistency
"**/config.py" = ["ARG001"]  # Config may have placeholder arguments
"**/storage/*.py" = ["ARG002"]  # Storage services may have interface placeholder arguments

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests that require live Home Assistant instance",
    "smoke: critical smoke tests for deployment verification",
    "integration: tests that require a live Home Assistant instance",
    "diagnostic: manual diagnostic tests for troubleshooting (not run in CI)",
    "slow: tests that take a long time to run",
]

[tool.coverage.run]
source = ["ha_automation"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false