alias: "Example: Turn on lights at sunset (Updated)"
description: "Automatically turn on porch lights 45 minutes before sunset with dimmer brightness"
trigger:
  - platform: sun
    event: sunset
    offset: "-00:45:00"  # Changed from 30 to 45 minutes
condition:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: "off"
action:
  - service: light.turn_on
    target:
      entity_id: light.porch
    data:
      brightness_pct: 50  # Changed from 75% to 50%
      transition: 15      # Increased transition time
  - service: notify.mobile_app
    data:
      message: "Porch lights turned on for sunset (updated automation)"
      title: "Home Automation"
mode: single