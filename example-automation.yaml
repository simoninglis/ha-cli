alias: "Example: Turn on lights at sunset"
description: "Automatically turn on porch lights 30 minutes before sunset"
trigger:
  - platform: sun
    event: sunset
    offset: "-00:30:00"
condition:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: "off"
action:
  - service: light.turn_on
    target:
      entity_id: light.porch
    data:
      brightness_pct: 75
      transition: 10
  - service: notify.mobile_app
    data:
      message: "Porch lights turned on for sunset"
      title: "Home Automation"
mode: single